[pytest]
testpaths = tests
python_files = test_*.py
# Integration tests talk to the live shared studionet endpoint, so they are opt-in.
# Direct-mode tests (the default) run in-memory with no server.
addopts = -m "not integration" -ra
markers =
    integration: exercises a live GenLayer studionet endpoint (real leader/validator consensus)
    direct: fast in-memory direct-mode contract test
filterwarnings =
    ignore::DeprecationWarning
